name: Release desktop apps

on:
  push:
    branches:
      - main
    tags:
      - work-hours-tracker-v*

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create release + changelog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    name: Build ${{ matrix.platform.name }}
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_args: --mac dmg zip -c.mac.identity=null
          - name: Windows
            os: windows-latest
            build_args: --win nsis
          - name: Linux
            os: ubuntu-latest
            build_args: --linux AppImage

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build && npx electron-builder ${{ matrix.platform.build_args }} --publish never

      - name: Verify macOS updater metadata
        if: matrix.platform.name == 'macOS'
        shell: bash
        run: |
          test -f dist/latest-mac.yml
          compgen -G "dist/*.zip.blockmap" > /dev/null
          node -e 'const asar = require("@electron/asar"); const files = asar.listPackage("dist/mac-arm64/Work Hours Tracker.app/Contents/Resources/app.asar"); if (!files.includes("/node_modules/builder-util-runtime/out/index.js")) process.exit(1);'

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Upload app installers and electron-updater metadata, not icons or web assets.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.yml" -o -name "*.blockmap" \) -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found in dist/"
            exit 1
          fi

          gh release upload "${{ needs.release.outputs.tag_name }}" "${files[@]}" --clobber

  build-tag-release:
    name: Build ${{ matrix.platform.name }} for tag
    if: startsWith(github.ref, 'refs/tags/work-hours-tracker-v')
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_args: --mac dmg zip -c.mac.identity=null
          - name: Windows
            os: windows-latest
            build_args: --win nsis
          - name: Linux
            os: ubuntu-latest
            build_args: --linux AppImage

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build && npx electron-builder ${{ matrix.platform.build_args }} --publish never

      - name: Verify macOS updater metadata
        if: matrix.platform.name == 'macOS'
        shell: bash
        run: |
          test -f dist/latest-mac.yml
          compgen -G "dist/*.zip.blockmap" > /dev/null
          node -e 'const asar = require("@electron/asar"); const files = asar.listPackage("dist/mac-arm64/Work Hours Tracker.app/Contents/Resources/app.asar"); if (!files.includes("/node_modules/builder-util-runtime/out/index.js")) process.exit(1);'

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true

          # Upload app installers and electron-updater metadata, not icons or web assets.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.yml" -o -name "*.blockmap" \) -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found in dist/"
            exit 1
          fi

          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
