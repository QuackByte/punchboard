name: Release desktop apps

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create release + changelog
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    name: Build ${{ matrix.platform.name }}
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_args: --mac dmg zip -c.mac.identity=null
          - name: Windows
            os: windows-latest
            build_args: --win nsis
          - name: Linux
            os: ubuntu-latest
            build_args: --linux AppImage

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build && npx electron-builder ${{ matrix.platform.build_args }} --publish never

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Upload only app installers, not icons or build artifacts
          files=$(find dist -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.zip" \) | sort)

          if [ -z "$files" ]; then
            echo "No release assets found in dist/"
            exit 1
          fi

          gh release upload "${{ needs.release.outputs.tag_name }}" $files --clobber
