name: Release desktop apps

on:
  push:
    branches:
      - main
    tags:
      - work-hours-tracker-v*

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create release + changelog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    name: Build ${{ matrix.platform.name }}
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_args: --mac dmg zip
          - name: Windows
            os: windows-latest
            build_args: --win nsis
          - name: Linux
            os: ubuntu-latest
            build_args: --linux AppImage

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Write the App Store Connect API key (.p8) from a base64 secret to a file
      # and expose its path. electron-builder's notarytool integration reads
      # APPLE_API_KEY as a *file path*, so it must exist on disk.
      - name: Prepare App Store Connect API key
        if: matrix.platform.name == 'macOS'
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # macOS: sign with the Developer ID cert (from the base64 .p12 secret) and
      # notarize via the App Store Connect API key (Apple's recommended path —
      # more reliable than the Apple ID + app-specific-password method).
      - name: Build app (macOS, signed + notarized)
        if: matrix.platform.name == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_API_KEY (path) comes from $GITHUB_ENV set in the step above.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build && npx electron-builder ${{ matrix.platform.build_args }} --publish never

      # Windows/Linux: no signing. CSC env vars are intentionally left unset —
      # defining CSC_LINK (even empty) makes electron-builder try to resolve it
      # as a file and fail (e.g. "Env WIN_CSC_LINK is not correct").
      - name: Build app (Windows/Linux, unsigned)
        if: matrix.platform.name != 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder ${{ matrix.platform.build_args }} --publish never

      - name: Verify macOS updater metadata
        if: matrix.platform.name == 'macOS'
        shell: bash
        run: |
          test -f dist/latest-mac.yml
          compgen -G "dist/*.zip.blockmap" > /dev/null
          node -e 'const asar = require("@electron/asar"); const files = asar.listPackage("dist/mac-arm64/Work Hours Tracker.app/Contents/Resources/app.asar"); if (!files.includes("/node_modules/builder-util-runtime/out/index.js")) process.exit(1);'

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Upload app installers and electron-updater metadata, not icons or web assets.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.yml" -o -name "*.blockmap" \) -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found in dist/"
            exit 1
          fi

          gh release upload "${{ needs.release.outputs.tag_name }}" "${files[@]}" --clobber

  build-tag-release:
    name: Build ${{ matrix.platform.name }} for tag
    if: startsWith(github.ref, 'refs/tags/work-hours-tracker-v')
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_args: --mac dmg zip
          - name: Windows
            os: windows-latest
            build_args: --win nsis
          - name: Linux
            os: ubuntu-latest
            build_args: --linux AppImage

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Write the App Store Connect API key (.p8) from a base64 secret to a file
      # and expose its path. electron-builder's notarytool integration reads
      # APPLE_API_KEY as a *file path*, so it must exist on disk.
      - name: Prepare App Store Connect API key
        if: matrix.platform.name == 'macOS'
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # macOS: sign with the Developer ID cert (from the base64 .p12 secret) and
      # notarize via the App Store Connect API key (Apple's recommended path —
      # more reliable than the Apple ID + app-specific-password method).
      - name: Build app (macOS, signed + notarized)
        if: matrix.platform.name == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_API_KEY (path) comes from $GITHUB_ENV set in the step above.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build && npx electron-builder ${{ matrix.platform.build_args }} --publish never

      # Windows/Linux: no signing. CSC env vars are intentionally left unset —
      # defining CSC_LINK (even empty) makes electron-builder try to resolve it
      # as a file and fail (e.g. "Env WIN_CSC_LINK is not correct").
      - name: Build app (Windows/Linux, unsigned)
        if: matrix.platform.name != 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder ${{ matrix.platform.build_args }} --publish never

      - name: Verify macOS updater metadata
        if: matrix.platform.name == 'macOS'
        shell: bash
        run: |
          test -f dist/latest-mac.yml
          compgen -G "dist/*.zip.blockmap" > /dev/null
          node -e 'const asar = require("@electron/asar"); const files = asar.listPackage("dist/mac-arm64/Work Hours Tracker.app/Contents/Resources/app.asar"); if (!files.includes("/node_modules/builder-util-runtime/out/index.js")) process.exit(1);'

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true

          # Upload app installers and electron-updater metadata, not icons or web assets.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.yml" -o -name "*.blockmap" \) -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found in dist/"
            exit 1
          fi

          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
